# Blog-Banner: ein dezenter Glas-Banner pro Artikel + Banner in der Blog-Übersicht (freigegeben: Anna-Lena, 04.11.2026).
# Markup: _includes/blog-banner.html (Banner), _layouts/post.html (Einfügen nach ca. der Hälfte, nach einem H2-Abschnitt),
# blog.html (Übersicht). Styles: assets/styles.css, Abschnitt 19.
#
# So wählt die Seite den Banner:
#   - artikel.<slug>.banner = Schlüssel aus „banner“ unten (Produkt/Empfehlung) oder „lesetipp“.
#   - lesetipp = kleine Glas-Karte „Passt dazu“ mit 1–2 Artikeln aus artikel.<slug>.lesetipp
#     (nur Artikel, die schon online sind; sonst neueste Artikel mit gleichem Thema).
#   - Artikel ohne Eintrag bekommen automatisch einen Lese-Tipp.
#   - bis/danach: ab dem Tag nach „bis“ zeigt der Banner automatisch das Produkt „danach“
#     (die Seite wird jeden Morgen neu gebaut).
# Themen-Regeln (welches Thema welches Produkt bekommt, Abwechseln bei Artikeln mit gleichem Thema)
# stehen in tools/blog_banner.py. Neue Artikel eintragen: python3 tools/blog_banner.py (ergänzt nur fehlende Einträge).
# Einzelne Einträge darfst du von Hand ändern; das Skript überschreibt sie nicht (außer mit --alle).
# Der Pinterest-Rabattcode kommt NIE in einen Banner.

banner:
  familienjahr:
    label: "Aus dem Shop"
    titel: "Unser Familienjahr 2027"
    zeile: "Alle Termine der Familie auf einen Blick"
    bild: /assets/app/ban-familienjahr.webp
    url: /etsy/familienjahr/
    los: "Ansehen →"
  kalender:
    label: "Aus dem Shop"
    titel: "Blütenjahr 2027"
    zeile: "Wandkalender mit Blumen oder deinen Fotos"
    bild: /assets/app/ban-kalender.webp
    url: /etsy/bluetenjahr/
    los: "Ansehen →"
  advent:
    label: "Aus dem Shop"
    titel: "Mein stiller Advent"
    zeile: "24 kleine Pausen für dich"
    bild: /assets/app/ban-advent.webp
    url: /etsy/advent/
    los: "Ansehen →"
    bis: "2026-12-24"
    danach: kalender
  affirmationen:
    label: "Aus dem Shop"
    titel: "Ein Satz, der bleibt"
    zeile: "24 Affirmationskarten fürs Glas"
    bild: /assets/app/ban-affirmationen.webp
    url: "https://nidrassa.etsy.com/listing/4598963310/perfect-for-christmas-affirmation-cards"
    extern: true
    los: "Ansehen →"
  mamatequiero:
    label: "Empfehlung"
    titel: "Mamá te quiero"
    zeile: "Ein Brief im Monat · nur 20 Founding-Plätze"
    bild: /assets/app/ban-mtq.webp
    url: /mamatequiero/
    los: "Warteliste →"
  lernen:
    label: "Empfehlung"
    titel: "Stress im Mama-Alltag"
    zeile: "Kostenloser Kurs, ohne Anmeldung"
    bild: /assets/app/ban-lernen.webp
    url: /lernen/
    los: "Ansehen →"

