# Links in the top navigation (and burger menu on phones).
# "nav" must match the page's front matter "nav" to highlight the current page.
main:
  - title: Übungen
    url: /uebungen/
    nav: uebungen
  - title: Blog
    url: /blog/
    nav: blog
  - title: Retreat
    url: /retreat/
    nav: retreat
  - title: Snail Mail
    url: /mamatequiero/
    nav: mamatequiero

# Links in the footer. Pages from the top navigation (Übungen, Blog, Retreat, Snail Mail) and Shop are not repeated here.
# Groups (heading order in _includes/footer.html): nidrassa, folge (social profiles), rechtliches.
footer:
  - title: Über
    group: nidrassa
    url: /#ueber
  - title: Pinterest
    group: folge
    url: https://www.pinterest.com/Nidrassa
    external: true
  - title: Instagram
    group: folge
    url: https://www.instagram.com/nidrassa/
    external: true
  - title: YouTube
    group: folge
    url: https://www.youtube.com/@nidrassa
    external: true
  # Impressum + Datenschutz are not listed here: they sit in the © line on every screen size (_includes/footer.html).
  - title: Deine Gewährleistungsrechte
    group: rechtliches
    url: /gewaehrleistung/
  - title: Versand
    group: rechtliches
    url: /versand/
