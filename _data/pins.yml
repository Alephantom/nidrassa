# Pinterest-Pins für die RSS-Feeds /pins/<feed>.rss  (Anleitung: PINTEREST_RSS_ANLEITUNG.md bei Cleo/nidrassa/pinterest)
#
# Ein Eintrag = ein Pin an einem Tag. Felder:
#   id:           Pin-Name aus dem Plan (= Bilddatei ohne .jpg). guid im Feed = id + datum,
#                 eine Wiederholung desselben Bildes an einem anderen Tag ist für Pinterest also ein neuer Pin.
#   feed:         Feed-Schlüssel = Board, siehe _data/pin_feeds.yml
#   datum:        "JJJJ-MM-TT" (Tag der Freigabe). Der Pin steht im Feed ab dem Build an diesem Tag
#                 (täglich 05:00 UTC = 06:00 Granada, oder bei jedem Merge) und bleibt 30 Tage drin.
#   uhrzeit:      "HH:MM" Uhrzeit Granada, nur für pubDate.
#   titel:        max. 100 Zeichen
#   beschreibung: max. ca. 420 Zeichen OHNE Rabattcode. Bei Etsy-Zielen hängt der Feed den Satz mit PINTEREST26 selbst an.
#   bild:         Dateiname unter /assets/pinterest/ (JPG, 1000×1500, ≤ 300 KB, muss im Repo liegen; fehlt es, bleibt der Pin draußen)
#   ziel:         advent | bluetenjahr | familienjahr (= /etsy/<ziel>/, siehe _data/etsy_links.yml)
#                 oder ein Pfad auf nidrassa.com, z. B. /mamatequiero/
#   aktiv:        true = wird veröffentlicht, false = bleibt draußen
#
# Paket 1 (04.–11.11.) wurde per CSV hochgeladen und kommt NICHT in die Feeds: die drei Beispiele unten bleiben IMMER aktiv: false.
# Ab 12.11. kommen die Pins aus advent_offensive/PLAN_v2 (erzeugt mit advent_offensive/feed_12-22_11.py).
# Platzhalter „neu (zu bauen)“ stehen auf aktiv: false. Wenn Bild + Text da sind: titel, beschreibung, bild eintragen, aktiv: true.

