# Pinterest-Pins für die RSS-Feeds /pins/<feed>.rss  (Anleitung: PINTEREST_RSS_ANLEITUNG.md bei Cleo/nidrassa/pinterest)
#
# Ein Eintrag = ein Pin. Felder:
#   id:           eindeutig, nie wiederverwenden (wird zur guid; Pinterest erkennt daran neue Pins)
#   feed:         advent | kalender | mamatequiero  (= Board, siehe _data/pin_feeds.yml)
#   datum:        "JJJJ-MM-TT HH:MM" Uhrzeit Granada. Der Pin erscheint im Feed ab dem ersten Build danach
#                 (täglich 06:00 Granada oder bei jedem Merge); Pinterest holt ihn dann innerhalb von 24 h.
#   titel:        max. 100 Zeichen
#   beschreibung: max. ca. 420 Zeichen OHNE Rabattcode. Bei Etsy-Zielen hängt der Feed den Satz mit PINTEREST26 selbst an.
#   bild:         Dateiname unter /assets/pinterest/ (JPG, 1000×1500, muss im Repo liegen)
#   ziel:         advent | bluetenjahr | familienjahr (= /etsy/<ziel>/, siehe _data/etsy_links.yml)
#                 oder ein Pfad auf nidrassa.com, z. B. /mamatequiero/
#   aktiv:        true = wird veröffentlicht, false = bleibt draußen
#
# Woche 1 (Paket 1, 04.–11.11.) wurde per CSV hochgeladen und kommt NICHT in die Feeds.
# Die drei Einträge unten sind nur Beispiele aus Paket 1 und bleiben dauerhaft aktiv: false.
# Die Feeds starten mit Paket 2 (Pins ab 12.11.).

