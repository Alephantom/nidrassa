# Brief-Club „Mamá te quiero“ – Texte für /mamatequiero/ (mamatequiero.html)
# Das Formular ist das bestehende Brevo-Formular (_includes/newsletter.html, _config.yml → newsletter_action).
# Inhalte + Founding-Preis freigegeben am 28.10.2026 (11 € im Monat zzgl. Versand, erste 20 Founding Members).
# Antworten dürfen HTML-Links enthalten (werden roh ausgegeben).

instagram: mamatequiero.club

faq:
  - frage: Wann geht es los?
    antwort: Der erste Brief kommt im Januar 2027. Auf der Warteliste erfährst du als Erste, wann die Anmeldung öffnet.
  - frage: Kostet die Warteliste etwas?
    antwort: Nein. Die Warteliste ist kostenlos und unverbindlich.
  - frage: Was kostet die Mitgliedschaft?
    antwort: 'Für die ersten 20 Founding Members kostet Mamá te quiero 11 € im Monat zzgl. Versand, als fester Preis für deine gesamte Mitgliedschaft. Die Versandkosten pro Brief findest du unter <a href="/versand/">Versand</a>.'
  - frage: Kann ich mich wieder austragen?
    antwort: Ja, jederzeit. In jeder E-Mail findest du einen Link, mit dem du dich mit einem Klick austragen kannst.
  - frage: Wohin liefert ihr?
    antwort: 'Der Brief kommt ganz klassisch per Post aus Spanien zu dir nach Hause, zum Beispiel nach Deutschland, Österreich, in die Schweiz und in die EU. Länder und Porto findest du unter <a href="/versand/">Versand</a>.'
