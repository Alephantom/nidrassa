# Assumes this Website folder is the root of the Git repository.
# Builds the site with Jekyll and publishes it to GitHub Pages.
# Runs on every push and once a day, so scheduled blog posts go live on their date.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          TZ: Europe/Berlin
      - name: JPG copies of the images (Pinterest RSS feed)
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          for f in glob.glob('_site/assets/*.webp'):
              Image.open(f).convert('RGB').save(f[:-5] + '.jpg', quality=88)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
